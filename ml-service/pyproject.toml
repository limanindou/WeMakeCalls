[project]
name = "wemakecalls-ml-service"
version = "0.1.0"
description = "ML Service for WeMakeCalls — Kedro + FastAPI MLOps pipeline"
requires-python = ">=3.12"
dependencies = [
    # Pipeline orchestration
    "kedro==1.3.1",
    "kedro-datasets==9.3.0",
    # API server
    "fastapi==0.136.1",
    "uvicorn==0.47.0",
    "pydantic==2.13.4",
    # ML models
    "catboost==1.2.10",
    "xgboost==3.2.0",
    "lightgbm==4.6.0",
    "scikit-learn==1.8.0",
    # Data processing
    "pandas==3.0.3",
    "numpy==2.4.6",
    "pyarrow==24.0.0",
    # Database
    "sqlalchemy==2.0.49",
    "psycopg2-binary==2.9.12",
    "pymongo>=4.10.1",
    # Serialisation
    "joblib==1.5.3",
    "httpx>=0.28.1",
    "dash>=4.1.0",
    "plotly>=6.7.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis==6.152.9",
    "pytest==9.0.3",
    "ruff==0.15.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wemakecalls"]

[tool.uv]
dev-dependencies = [
    "hypothesis==6.152.9",
    "pytest==9.0.3",
    "ruff==0.15.14",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["wemakecalls"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
