@if (visible()) {
  <p-dialog
    header="Call Feedback"
    [visible]="visible()"
    (visibleChange)="visible.set($event)"
    [modal]="true"
    [closable]="false"
    [style]="{ width: '400px' }"
  >
    <div class="feedback-form">
      <div class="field">
        <label>Hangup Reason</label>
        <p-select
          [options]="hangupReasons"
          [(ngModel)]="selectedReason"
          optionLabel="label"
          optionValue="value"
          placeholder="Select a reason"
          [style]="{ width: '100%' }"
        />
      </div>

      <div class="field">
        <label>Agent Rating</label>
        <p-rating [(ngModel)]="agentRating" />
      </div>
    </div>

    <ng-template #footer>
      <p-button
        label="Submit"
        icon="pi pi-check"
        (onClick)="submit()"
        [disabled]="!selectedReason || agentRating < 1"
        severity="success"
      />
    </ng-template>
  </p-dialog>
}
