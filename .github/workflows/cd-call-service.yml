# Build + push call-service image + smoke test
name: CD - Deploy Call Service (Spring Boot)

"on":
  push:
    branches: [main, master]
    paths:
      - 'call-service/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: cd-call-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push Call Service Docker Image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect Registry Configuration
        id: registry
        run: |
          if [ -n "${{ secrets.REGISTRY_URL }}" ] && [ -n "${{ secrets.REGISTRY_USERNAME }}" ] && [ -n "${{ secrets.REGISTRY_PASSWORD }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Application Package
        run: |
          cd call-service
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        if: steps.registry.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract Docker Metadata
        if: steps.registry.outputs.enabled == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.REGISTRY_URL }}/${{ secrets.REGISTRY_USERNAME }}/wemakecalls
          tags: |
            type=sha,prefix=call-service-,format=long
            type=raw,value=call-service-latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push Docker Image
        if: steps.registry.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./call-service
          file: ./call-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Docker Image (No Registry Push)
        if: steps.registry.outputs.enabled != 'true'
        run: docker build -t call-service:ci ./call-service

  # =================================================================
  # SMOKE TEST - Verify the container starts and responds
  # =================================================================
  smoke-test:
    name: Smoke Test Call Service
    runs-on: ubuntu-latest
    needs: build-and-push

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

      postgresql:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: wemakecalls
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Initialize PostgreSQL Schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d wemakecalls \
            -f call-service/src/main/resources/schema-postgres.sql

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Application Package
        run: |
          cd call-service
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Build Docker Image Locally
        run: docker build -t call-service:smoke ./call-service

      - name: Start Container
        run: |
          docker run -d --name call-service-smoke \
            --network host \
            -e SPRING_DATA_MONGODB_URI=mongodb://localhost:27017/call-service \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/wemakecalls \
            -e SPRING_DATASOURCE_USERNAME=postgres \
            -e SPRING_DATASOURCE_PASSWORD=postgres \
            -e SERVER_PORT=5000 \
            call-service:smoke

      - name: Wait for Startup
        run: |
          echo "Waiting for call-service to start..."
          HEALTH_URL="http://localhost:5000/agents/available"
          for i in $(seq 1 30); do
            TMP_BODY=$(mktemp)
            set +e
            HTTP_STATUS=$(curl -sS -o "$TMP_BODY" -w "%{http_code}" "$HEALTH_URL")
            CURL_EXIT=$?
            set -e

            if [ "$CURL_EXIT" -eq 0 ] && [ "$HTTP_STATUS" = "200" ]; then
              echo "Service is healthy!"
              rm -f "$TMP_BODY"
              exit 0
            fi

            BODY_SNIPPET=$(tr -d '\n' < "$TMP_BODY" | head -c 200)
            if [ "$CURL_EXIT" -ne 0 ]; then
              echo "Attempt $i/30 - curl failed (exit=$CURL_EXIT, http=$HTTP_STATUS) - waiting 2s..."
            else
              echo "Attempt $i/30 - endpoint returned HTTP $HTTP_STATUS (body: ${BODY_SNIPPET:-<empty>}) - waiting 2s..."
            fi
            rm -f "$TMP_BODY"
            sleep 2
          done
          echo "Service failed to start within 60 seconds (last endpoint: $HEALTH_URL)"
          docker logs call-service-smoke
          exit 1

      - name: Verify Service Endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/agents/available)
          if [ "$STATUS" != "200" ]; then
            echo "Service endpoint check failed with status $STATUS"
            docker logs call-service-smoke
            exit 1
          fi
          echo "Service endpoint check passed (HTTP $STATUS)"

      - name: Verify Agents Endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/agents/available)
          if [ "$STATUS" != "200" ]; then
            echo "Agents endpoint failed with status $STATUS"
            docker logs call-service-smoke
            exit 1
          fi
          echo "Agents endpoint passed (HTTP $STATUS)"

      - name: Cleanup
        if: always()
        run: docker rm -f call-service-smoke || true
