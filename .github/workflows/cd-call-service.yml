# Build + push call-service image + smoke test
name: CD - Deploy Call Service (Spring Boot)

"on":
  push:
    branches: [main, master]
    paths:
      - 'call-service/**'
  workflow_dispatch:

concurrency:
  group: cd-call-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push Call Service Docker Image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Application Package
        run: |
          cd call-service
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.REGISTRY_URL }}/call-service
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./call-service
          file: ./call-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =================================================================
  # SMOKE TEST - Verify the container starts and responds
  # =================================================================
  smoke-test:
    name: Smoke Test Call Service
    runs-on: ubuntu-latest
    needs: build-and-push

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Application Package
        run: |
          cd call-service
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Build Docker Image Locally
        run: docker build -t call-service:smoke ./call-service

      - name: Start Container
        run: |
          docker run -d --name call-service-smoke \
            --network host \
            -e SPRING_DATA_MONGODB_URI=mongodb://localhost:27017/call-service \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/wemakecalls \
            -e SERVER_PORT=5000 \
            call-service:smoke

      - name: Wait for Startup
        run: |
          echo "Waiting for call-service to start..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/actuator/health 2>/dev/null; then
              echo "Service is healthy!"
              exit 0
            fi
            echo "Attempt $i/30 - waiting 2s..."
            sleep 2
          done
          echo "Service failed to start within 60 seconds"
          docker logs call-service-smoke
          exit 1

      - name: Verify Health Endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/actuator/health)
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed with status $STATUS"
            docker logs call-service-smoke
            exit 1
          fi
          echo "Health check passed (HTTP $STATUS)"

      - name: Verify Agents Endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/agents/available)
          if [ "$STATUS" != "200" ]; then
            echo "Agents endpoint failed with status $STATUS"
            docker logs call-service-smoke
            exit 1
          fi
          echo "Agents endpoint passed (HTTP $STATUS)"

      - name: Cleanup
        if: always()
        run: docker rm -f call-service-smoke || true
