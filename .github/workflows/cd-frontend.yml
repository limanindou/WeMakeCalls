# Build + push frontend image + smoke test
name: CD - Deploy Frontend (Angular)

on:
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'

concurrency:
  group: cd-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push Frontend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect Registry Configuration
        id: registry
        run: |
          if [ -n "${{ secrets.REGISTRY_URL }}" ] && [ -n "${{ secrets.REGISTRY_USERNAME }}" ] && [ -n "${{ secrets.REGISTRY_PASSWORD }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        if: steps.registry.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract Docker Metadata
        if: steps.registry.outputs.enabled == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.REGISTRY_URL }}/frontend
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push Docker Image
        if: steps.registry.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Docker Image (No Registry Push)
        if: steps.registry.outputs.enabled != 'true'
        run: docker build -t frontend:ci ./frontend

  # =================================================================
  # SMOKE TEST - Verify Nginx serves the Angular app
  # =================================================================
  smoke-test:
    name: Smoke Test Frontend
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image Locally
        run: docker build -t frontend:smoke ./frontend

      - name: Start Container
        run: |
          docker run -d --name frontend-smoke \
            -p 4200:80 \
            frontend:smoke

      - name: Wait for Startup
        run: |
          echo "Waiting for frontend to start..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:4200 2>/dev/null; then
              echo "Frontend is serving!"
              exit 0
            fi
            echo "Attempt $i/20 - waiting 2s..."
            sleep 2
          done
          echo "Frontend failed to start within 40 seconds"
          docker logs frontend-smoke
          exit 1

      - name: Verify HTML Response
        run: |
          RESPONSE=$(curl -s http://localhost:4200)
          if echo "$RESPONSE" | grep -q "</html>"; then
            echo "Frontend is serving valid HTML!"
          else
            echo "Frontend did not return valid HTML"
            echo "$RESPONSE" | head -20
            exit 1
          fi

      - name: Verify Static Assets (CSS/JS)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4200/styles.css 2>/dev/null || echo "000")
          echo "styles.css: HTTP $STATUS"
          # Angular bundles have hashed names, just verify the main page loads
          curl -s http://localhost:4200 | grep -q "script" && echo "JS bundles referenced in HTML" || echo "Warning: no script tags found"

      - name: Cleanup
        if: always()
        run: docker rm -f frontend-smoke || true
