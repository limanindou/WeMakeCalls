# Build + push ml-service image + smoke test
name: CD - Deploy ML Service

"on":
  push:
    branches: [main, master]
    paths:
      - 'ml-service/**'
  workflow_dispatch:

concurrency:
  group: cd-ml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push ML Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect Registry Configuration
        id: registry
        run: |
          if [ -n "${{ secrets.REGISTRY_URL }}" ] && [ -n "${{ secrets.REGISTRY_USERNAME }}" ] && [ -n "${{ secrets.REGISTRY_PASSWORD }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        if: steps.registry.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract Docker Metadata
        if: steps.registry.outputs.enabled == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.REGISTRY_URL }}/ml-service
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push Docker Image
        if: steps.registry.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./ml-service
          file: ./ml-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Docker Image (No Registry Push)
        if: steps.registry.outputs.enabled != 'true'
        run: docker build -t ml-service:ci ./ml-service

  # =================================================================
  # SMOKE TEST - Verify the container starts and responds
  # =================================================================
  smoke-test:
    name: Smoke Test ML Service
    runs-on: ubuntu-latest
    needs: build-and-push

    services:
      postgresql:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: wemakecalls
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 20); do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL ($i/20)..."
            sleep 2
          done
          echo "PostgreSQL did not become ready"
          exit 1

      - name: Create Database Tables
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d wemakecalls -c "
            CREATE TABLE IF NOT EXISTS call_logs (
              call_id TEXT PRIMARY KEY,
              started_at TIMESTAMPTZ,
              duration_seconds INT,
              queue_name TEXT,
              agent_id TEXT,
              wait_time_seconds INT,
              abandoned BOOLEAN,
              hangup_reason TEXT,
              source TEXT
            );
            CREATE TABLE IF NOT EXISTS predictions (
              id SERIAL PRIMARY KEY,
              predicted_at TIMESTAMPTZ,
              target_hour TIMESTAMPTZ,
              predicted_calls INT,
              model_type TEXT,
              mae FLOAT,
              rmse FLOAT,
              mape FLOAT
            );"

      - name: Build Docker Image Locally
        run: docker build -t ml-service:smoke ./ml-service

      - name: Start Container
        run: |
          docker run -d --name ml-service-smoke \
            --network host \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/wemakecalls \
            ml-service:smoke

      - name: Wait for Startup
        run: |
          echo "Waiting for ml-service to start..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health 2>/dev/null; then
              echo "Service is healthy!"
              exit 0
            fi
            echo "Attempt $i/30 - waiting 2s..."
            sleep 2
          done
          echo "Service failed to start within 60 seconds"
          docker logs ml-service-smoke
          exit 1

      - name: Verify Health Endpoint
        run: |
          RESPONSE=$(curl -s http://localhost:8000/health)
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"status":"ok"' || (echo "Unexpected response" && exit 1)
          echo "Health check passed!"

      - name: Verify Model Info Endpoint (503 expected - no model trained)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/model/info)
          if [ "$STATUS" != "503" ] && [ "$STATUS" != "200" ]; then
            echo "Model info endpoint returned unexpected status $STATUS"
            docker logs ml-service-smoke
            exit 1
          fi
          echo "Model info endpoint responded correctly (HTTP $STATUS)"

      - name: Verify Predict Endpoint Validation (422 expected)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"calls_lag_1h": 10}')
          if [ "$STATUS" != "422" ]; then
            echo "Predict validation failed - expected 422, got $STATUS"
            docker logs ml-service-smoke
            exit 1
          fi
          echo "Predict validation passed (HTTP 422 for incomplete request)"

      - name: Cleanup
        if: always()
        run: docker rm -f ml-service-smoke || true
