# Runs tests on every PR
name: CI - Pull Request Validation

on:
  pull_request:
    branches: [main, master]

jobs:
  # =================================================================
  # 1. ANGULAR FRONTEND CI JOB
  # =================================================================
  test-frontend:
    name: Test Angular Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'

      - name: Set up Node.js
        if: steps.filter.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        if: steps.filter.outputs.frontend == 'true'
        run: |
          cd frontend
          npm ci

      - name: Lint Code
        if: steps.filter.outputs.frontend == 'true'
        run: |
          cd frontend
          npm run lint --if-present

      - name: Run Frontend Tests
        if: steps.filter.outputs.frontend == 'true'
        run: |
          cd frontend
          npm run test -- --watch=false --browsers=ChromeHeadless

  # =================================================================
  # 2. JAVA CALL SERVICE CI JOB
  # =================================================================
  test-call-service:
    name: Test Call Service (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            call-service:
              - 'call-service/**'

      - name: Set up JDK 17
        if: steps.filter.outputs.call-service == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Call Service Tests
        if: steps.filter.outputs.call-service == 'true'
        run: |
          cd call-service
          chmod +x mvnw
          ./mvnw clean test

  # =================================================================
  # 3. PYTHON ML SERVICE CI JOB
  # =================================================================
  test-ml-service:
    name: Test Python ML Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ml:
              - 'ml-service/**'

      - name: Set up Python
        if: steps.filter.outputs.ml == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        if: steps.filter.outputs.ml == 'true'
        run: pip install uv

      - name: Install Dependencies
        if: steps.filter.outputs.ml == 'true'
        run: |
          cd ml-service
          uv sync

      - name: Lint with Ruff
        if: steps.filter.outputs.ml == 'true'
        run: |
          cd ml-service
          uv run ruff check .

      - name: Run Unit Tests
        if: steps.filter.outputs.ml == 'true'
        run: |
          cd ml-service
          uv run pytest tests/unit/ -v

      - name: Run Property Tests
        if: steps.filter.outputs.ml == 'true'
        run: |
          cd ml-service
          uv run pytest tests/property/ -v
